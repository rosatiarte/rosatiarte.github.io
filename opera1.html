.percorsi-opere {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 40px;
  margin-top: 10px;
}

.percorso-opera {
  display: block;
  color: inherit;
  text-decoration: none;
  border-top: 1px solid #e8e8e8;
  padding-top: 25px;
}

.percorso-opera img {
  display: block;
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1;
  object-fit: contain;
  margin: 0 0 22px;
  transition: opacity 0.25s;
}

.percorso-opera:hover img {
  opacity: 0.8;
}

.percorso-opera h2 {
  font-size: 24px;
  font-weight: normal;
  margin: 0 0 10px;
}

.percorso-opera p {
  font-size: 15px;

  color: #555;
  margin: 0;
}

  }
