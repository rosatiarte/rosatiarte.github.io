  <div id="visualizzatore" hidden>
    <button id="chiudi" aria-label="Chiudi ingrandimento">&times;</button>
    <img id="immagine-grande" src="" alt="">
  </div>

  <script>
    const visualizzatore = document.getElementById('visualizzatore');
    const immagineGrande = document.getElementById('immagine-grande');
    const pulsanteChiudi = document.getElementById('chiudi');

    function apriIngrandimento(immagine) {
      immagineGrande.src = immagine.src;
      immagineGrande.alt = immagine.alt;
      visualizzatore.hidden = false;
    }

    function chiudiIngrandimento() {
      visualizzatore.hidden = true;
      immagineGrande.src = '';
    }

    document.querySelectorAll('.ingrandibile').forEach(function(immagine) {
      immagine.addEventListener('click', function() {
        apriIngrandimento(immagine);
      });

      immagine.addEventListener('keydown', function(evento) {
        if (evento.key === 'Enter' || evento.key === ' ') {
          evento.preventDefault();
          apriIngrandimento(immagine);
        }
      });

      immagine.tabIndex = 0;
      immagine.setAttribute('role', 'button');
      immagine.setAttribute('aria-label', 'Ingrandisci: ' + immagine.alt);
    });

    pulsanteChiudi.addEventListener('click', chiudiIngrandimento);

    visualizzatore.addEventListener('click', function(evento) {
      if (evento.target === visualizzatore) {
        chiudiIngrandimento();
      }
    });

    document.addEventListener('keydown', function(evento) {
      if (evento.key === 'Escape') {
        chiudiIngrandimento();
      }
    });
  </script>
