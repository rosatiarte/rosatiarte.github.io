
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visioni – Pierangelo Rosati</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      background: #fff;
      color: #222;
      font-family: Georgia, serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 55px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: normal;
    }

    header p {
      margin-top: 12px;
      color: #666;
      font-size: 15px;
    }

    header nav {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-top: 24px;
    }

    header nav a {
      color: #333;
      text-decoration: none;
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
    }

    header nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .galleria {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 50px 35px;
    }

    .opera {
      margin: 0;
    }


.opera img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  height: auto;
  object-fit: cover;
  cursor: pointer;
}

  figcaption {
  margin-top: 13px;
  font-size: 16px;
}

figcaption small {
  display: block;
  margin-top: 6px;
  color: #777;
  font-size: 12px;
}

    .segnaposto {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e5e5;
      color: #aaa;
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
    }

    .segnaposto figcaption {
      margin: 0;
    }

    #ingrandimento {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      padding: 30px;
      cursor: pointer;
    }

    #ingrandimento img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
    }

    #chiudi {
      position: absolute;
      top: 18px;
      right: 28px;
      color: white;
      font: 32px Arial, sans-serif;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 18px;
      }

      header {
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 27px;
      }

      .galleria {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .segnaposto {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Visioni</h1>
    <p>Immagini, forme e simboli oltre la figura umana.</p>

    <nav>
      <a href="index.html">HOME</a>
      <a href="opere.html">OPERE</a>
    </nav>
  </header>

  <main>
    <div class="galleria">

      <figure class="opera">
        <img src="pazzi.jpg"
             alt="La congiura dei Pazzi"
             onclick="ingrandisci(this)">
<figcaption>
  La congiura dei Pazzi
  <small>2024 · acrilici su carta · 50 x 700 cm</small>
</figcaption>
      </figure>

      <figure class="opera">
        <img src="torre.jpg"
             alt="La torre"
             onclick="ingrandisci(this)">
<figcaption>
  La torre
  <small>2024 · acrilici su carta · 21 x 29.7 cm</small>
</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 3</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 4</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 5</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 6</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 7</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 8</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 9</figcaption>
      </figure>

      <figure class="opera segnaposto">
        <figcaption>OPERA 10</figcaption>
      </figure>

    </div>
  </main>

  <div id="ingrandimento" onclick="chiudiIngrandimento()">
    <span id="chiudi">&times;</span>
    <img id="immagineGrande" src="" alt="">
  </div>

  <script>
    function ingrandisci(immagine) {
      const overlay = document.getElementById('ingrandimento');
      document.getElementById('immagineGrande').src = immagine.src;
      document.getElementById('immagineGrande').alt = immagine.alt;
      overlay.style.display = 'flex';
    }

    function chiudiIngrandimento() {
      document.getElementById('ingrandimento').style.display = 'none';
    }

    document.addEventListener('keydown', function(evento) {
      if (evento.key === 'Escape') {
        chiudiIngrandimento();
      }
    });
  </script>

</body>
</html>
